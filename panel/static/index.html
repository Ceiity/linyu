<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>奶龙控制台</title>
  <link rel="icon" href="/assets/nailong-robot.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f5f4f3">
  <link rel="stylesheet" href="/assets/style.css?v=20261101-flclash">
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="brand-mark logo-mark"><img src="/assets/nailong-robot.svg" alt="奶龙商标"></div>
      <h1>奶龙控制台</h1>
      <p>管理 AstrBot 与 NapCat 机器人，从这里开始。</p>
      <label>账号<input id="loginUser" autocomplete="off" spellcheck="false" placeholder="请输入面板账号"></label>
      <label>密码<input id="loginPass" type="password" autocomplete="off" placeholder="请输入面板密码"></label>
      <button class="primary wide" onclick="login()">进入面板</button>
      <div id="loginMsg" class="muted"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand" onclick="go('dashboard')"><div class="brand-mark small logo-mark"><img src="/assets/nailong-robot.svg" alt="奶龙"></div><div><b>奶龙</b><span>AstrBot Panel</span></div></div>
      <nav id="nav"></nav>
    </aside>
    <header class="topbar">
      <button class="icon-btn mobile-only" onclick="toggleDrawer()" aria-label="打开菜单"><svg class="adb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><h2 id="pageTitle">仪表盘</h2><span id="pageSub">系统总览</span></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="refresh(true,true)" title="刷新" aria-label="刷新"><svg class="adb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5A8 8 0 1 0 17.6 17"/><path d="M20 5v6.5h-6.5"/></svg></button>
        <button id="themeToggle" class="theme-toggle" onclick="cycleThemeMode()" aria-label="切换主题"></button>
        <button id="globalStatus" class="status-orb grey" onclick="go('astrbot')" title="检测中" aria-label="检测中"><svg class="adb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6H21"/></svg></button>
      </div>
    </header>
    <main id="content" class="content"></main>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>

  <div id="themeMenu" class="theme-menu hidden" role="menu"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div id="modalBody"></div><div class="modal-actions"><button onclick="closeModal()">&#x53d6;&#x6d88;</button><button id="modalOk" class="danger">&#x786e;&#x8ba4;</button></div></div></div>
  <div id="toast" class="toast"></div>
  <script src="/assets/app.js?v=20261101-flclash"></script>
</body>
</html>
