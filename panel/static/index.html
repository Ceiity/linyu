<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>奶龙控制台</title>
  <link rel="icon" href="/assets/nailong-robot.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#efedf0">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="奶龙">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/assets/style.css?v=20261102-300">
  <link rel="stylesheet" href="/assets/nextgen.css?v=20261102-300">
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="brand-mark logo-mark"><img src="/assets/nailong-robot.svg" alt="奶龙商标"></div>
      <h1>奶龙控制台</h1>
      <p>管理 AstrBot 与 NapCat / SnowLuma 机器人，从这里开始。</p>
      <label>账号<input id="loginUser" autocomplete="username" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="请输入面板账号"></label>
      <label>密码<input id="loginPass" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="请输入面板密码"></label>
      <button id="loginBtn" class="primary wide" onclick="login()">进入面板</button>
      <div id="loginMsg" class="muted"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand" onclick="go('dashboard')"><div class="brand-mark small logo-mark"><img src="/assets/nailong-robot.svg" alt="奶龙"></div><div><b>奶龙</b><span>AstrBot Panel</span></div></div>
      <nav id="nav"></nav>
    </aside>
    <header class="topbar">
      <button id="backBtn" class="icon-btn back-btn" onclick="go('more')" aria-label="返回"><svg class="adb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5.5M11 5.5 4.5 12l6.5 6.5"/></svg></button>
      <div><h2 id="pageTitle">仪表盘</h2><span id="pageSub">系统总览</span></div>
      <div class="top-actions">
        <button class="icon-btn refresh-btn" onclick="refresh(true,true)" title="刷新" aria-label="刷新"><svg class="adb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5A8 8 0 1 0 17.6 17"/><path d="M20 5v6.5h-6.5"/></svg></button>
        <button id="themeToggle" class="theme-toggle" onclick="cycleThemeMode()" aria-label="切换主题"></button>
        <button id="globalStatus" class="status-orb grey" onclick="go('astrbot')" title="检测中" aria-label="检测中"><svg class="adb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6H21"/></svg></button>
      </div>
    </header>
    <main id="content" class="content"></main>
    <nav id="bottomNav" role="tablist" aria-label="主导航"></nav>
  </div>

  <div id="themeMenu" class="theme-menu hidden" role="menu"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div id="modalBody"></div><div class="modal-actions"><button onclick="closeModal()">&#x53d6;&#x6d88;</button><button id="modalOk" class="danger">&#x786e;&#x8ba4;</button></div></div></div>
  <script src="/assets/vendor/qrcode.js?v=1.4.4"></script>
  <script src="/assets/motion.js?v=20261102-300"></script>
  <script src="/assets/app.js?v=20261102-300"></script>
  <script src="/assets/nextgen.js?v=20261102-300"></script>
</body>
</html>
