<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">奶龙</title>
  <desc id="desc">一只圆滚滚的黄色小龙头像，用于 AstrBot-Deploy 控制台品牌标识。</desc>
  <defs>
    <linearGradient id="bg" x1="88" y1="54" x2="434" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F1A0E"/>
      <stop offset="0.55" stop-color="#17140C"/>
      <stop offset="1" stop-color="#0B0904"/>
    </linearGradient>
    <radialGradient id="body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(222 208) rotate(58) scale(250 270)">
      <stop offset="0" stop-color="#FFF4B8"/>
      <stop offset="0.45" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#F7B928"/>
    </radialGradient>
    <linearGradient id="belly" x1="256" y1="300" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBE6"/>
      <stop offset="1" stop-color="#FFEFB0"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset="1" stop-color="#F4C95D"/>
    </linearGradient>
    <filter id="soft" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="116" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- horns -->
    <path d="M178 150C166 118 170 92 186 76C200 98 210 124 212 146Z" fill="url(#horn)" stroke="#3B2A08" stroke-width="9" stroke-linejoin="round"/>
    <path d="M334 150C346 118 342 92 326 76C312 98 302 124 300 146Z" fill="url(#horn)" stroke="#3B2A08" stroke-width="9" stroke-linejoin="round"/>
    <!-- ears -->
    <path d="M128 206C104 192 92 170 96 150C120 154 140 170 150 190Z" fill="#FFD84D" stroke="#3B2A08" stroke-width="9" stroke-linejoin="round"/>
    <path d="M384 206C408 192 420 170 416 150C392 154 372 170 362 190Z" fill="#FFD84D" stroke="#3B2A08" stroke-width="9" stroke-linejoin="round"/>
    <!-- head + body -->
    <path d="M256 128C340 128 396 182 400 258C404 330 372 410 256 414C140 410 108 330 112 258C116 182 172 128 256 128Z" fill="url(#body)" stroke="#3B2A08" stroke-width="10"/>
    <!-- belly -->
    <path d="M196 330C206 304 228 292 256 292C284 292 306 304 316 330C326 360 312 398 256 400C200 398 186 360 196 330Z" fill="url(#belly)"/>
    <path d="M214 336H298M210 362H302" stroke="#F2CF6B" stroke-width="7" stroke-linecap="round"/>
    <!-- back spikes -->
    <path d="M236 132L246 112L256 128L266 112L276 132" fill="#FFB020" stroke="#3B2A08" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- eyes -->
  <ellipse cx="208" cy="238" rx="24" ry="28" fill="#2A1E06"/>
  <ellipse cx="304" cy="238" rx="24" ry="28" fill="#2A1E06"/>
  <circle cx="216" cy="228" r="9" fill="#FFFFFF"/>
  <circle cx="312" cy="228" r="9" fill="#FFFFFF"/>
  <circle cx="200" cy="250" r="4" fill="#FFFFFF" opacity=".8"/>
  <circle cx="296" cy="250" r="4" fill="#FFFFFF" opacity=".8"/>
  <!-- blush -->
  <ellipse cx="166" cy="280" rx="22" ry="13" fill="#FF8A80" opacity=".55"/>
  <ellipse cx="346" cy="280" rx="22" ry="13" fill="#FF8A80" opacity=".55"/>
  <!-- nostrils + smile -->
  <circle cx="246" cy="266" r="3.5" fill="#3B2A08"/>
  <circle cx="266" cy="266" r="3.5" fill="#3B2A08"/>
  <path d="M226 282C238 300 274 300 286 282" stroke="#3B2A08" stroke-width="9" stroke-linecap="round"/>
  <path d="M244 292C248 304 264 304 268 292" fill="#FF7A6B"/>
</svg>
