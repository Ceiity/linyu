name: 奶龙 Nailong

on:
  push:
    branches: [main]
    paths: ['nailong/**', '.github/workflows/nailong.yml']
    tags: ['nailong-v*']
  pull_request:
    paths: ['nailong/**', '.github/workflows/nailong.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Agent 测试
        working-directory: nailong/agent
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest httpx
          pytest -q
      - name: 安装器测试
        working-directory: nailong/installer
        run: pytest -q tests

  android:
    needs: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nailong/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: 打包服务器组件
        run: python3 ../tool/bundle_server.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: 配置签名
        env:
          KEYSTORE: ${{ secrets.NAILONG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NAILONG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAILONG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NAILONG_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: nailong-apk
          path: nailong/app/build/app/outputs/flutter-apk/*-release.apk
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/nailong-v')
        uses: softprops/action-gh-release@v2
        with:
          files: nailong/app/build/app/outputs/flutter-apk/*-release.apk
