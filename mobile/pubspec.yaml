name: linyu_app
description: "淋雨控制台手机端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  pointycastle: ^4.0.0
  dynamic_color: ^2.1.0
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/square.png"
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/foreground.png"
  min_sdk_android: 21
